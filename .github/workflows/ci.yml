name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend tests
        working-directory: backend
        run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lockfile must not pin a third-party registry
        working-directory: frontend
        run: |
          # 锁文件里 124 条 resolved 曾经全指向 http://mirrors.tencent.com（明文 HTTP），
          # 那台镜像一抖，Docker 构建就在 npm ci 上 ETIMEDOUT —— 与代码无关的部署失败。
          # 这一格防止它在别处重新生成锁文件时又悄悄绑上去：只允许默认源。
          hosts=$(grep -o '"resolved": "https\?://[^/]*' package-lock.json | sed 's/.*"resolved": "https\?:\/\///' | sort -u)
          echo "lockfile 里的下载源: ${hosts:-<空>}"
          if [ "$hosts" != "registry.npmjs.org" ]; then
            echo "::error::package-lock.json 绑定了第三方 registry：${hosts:-<空>}（镜像抖动会直接让部署失败）"
            exit 1
          fi
      - name: Frontend typecheck + build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # 镜像能构建 + 能启动，才算「部署没问题」。
  # 单独加这一步的理由：backend/frontend 两个 job 验的是源码，而用户真正跑的是
  # Dockerfile 产出的镜像 —— COPY 路径写错、entrypoint 权限丢了、JRE 里缺东西，
  # 前两个 job 全是绿的，只有部署那一刻才炸。
  # 除了 build 还真的把容器跑起来打一次 /api/health：
  # 这一步同时验证了 entrypoint 的 gosu 降权、/data 可写、前端产物落位。
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # load 是为了下一步能直接 docker run 这个镜像
          load: true
          tags: animeko-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container + frontend assets)
        run: |
          set -euo pipefail
          # /data 用 tmpfs 并指定 uid/gid：entrypoint 会 chown 后降权到 app(10001)，
          # 这样能同时验证「非 root 用户可写数据目录」
          docker run -d --name animeko-ci \
            -p 18080:8080 \
            --tmpfs /data:rw,uid=10001,gid=10001 \
            animeko-web:ci

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/health >/tmp/health.json 2>/dev/null; then
              echo "health OK after ${i}s: $(cat /tmp/health.json)"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' animeko-ci)" != "true" ]; then
              echo "::error::容器启动后退出了"
              docker logs animeko-ci
              exit 1
            fi
            if [ "$i" = "60" ]; then
              echo "::error::60 秒内 /api/health 没有就绪"
              docker logs animeko-ci
              exit 1
            fi
            sleep 1
          done

          # 降权与 /data 可写要验的是**服务进程**，不是 `docker exec` 起来的 shell。
          # 上一版这里写的是 `docker exec … id -u`，那是条恒假的断言：exec 用的是镜像
          # 配置的默认用户，而本 Dockerfile 没有 `USER` 指令（它从 root 起，只在
          # entrypoint 里用 gosu 把服务本体降下来），所以 exec 永远报 0。
          # 实测：CI 在 590acdf 上就报「容器内进程 uid=0」，而那时 gosu 是生效的。
          #
          # 现在按三条各自能证明的东西来问：
          #  1) PID 1 的 Uid —— 入口脚本是 `exec gosu app "$0"`、服务又是 `exec` 上去的，
          #     所以 PID 1 就是服务本体，它的 uid 才是真相；
          #  2) /data/selectors 的属主 —— 这个目录是服务在启动时自己建的（SelectorRepository
          #     的 init），属主是 10001 就等于同时证明了「进程以该 uid 运行」和「它能写 /data」；
          #  3) 以 10001 身份测 /data 可写 —— `-u 10001` 让 exec 用运行用户的身份，
          #     root 的 exec 来测可写性毫无意义（root 什么都能写）。
          UID_IN=$(docker exec animeko-ci awk '/^Uid:/{print $2}' /proc/1/status)
          if [ "$UID_IN" != "10001" ]; then
            echo "::error::服务进程（PID 1）uid=$UID_IN，期望 10001：entrypoint 的 gosu 降权没生效"
            docker logs animeko-ci
            exit 1
          fi
          SEL_OWNER=$(docker exec animeko-ci stat -c '%u' /data/selectors)
          if [ "$SEL_OWNER" != "10001" ]; then
            echo "::error::/data/selectors 属主是 $SEL_OWNER 而不是 10001：服务没能在数据卷上写入"
            docker exec animeko-ci ls -ld /data /data/selectors || true
            exit 1
          fi
          docker exec -u 10001 animeko-ci test -w /data || {
            echo "::error::/data 对运行用户（10001）不可写，个人数据与数据源导入都会失败"
            docker exec animeko-ci ls -ld /data || true
            exit 1
          }
          echo "privilege drop OK: PID 1 uid=$UID_IN, /data/selectors owner=$SEL_OWNER, writable by 10001"

          # 前端产物：health 只能证明后端活着。dist 没落位时它照样 200，
          # 而用户打开是一张白页 —— 这种故障从 CI 里最看不出来，所以必须单独验。
          curl -fsS http://127.0.0.1:18080/ -o /tmp/index.html
          if ! grep -q 'id="root"' /tmp/index.html; then
            echo "::error::首页返回的不是前端 HTML（dist 没落位？）"
            head -c 400 /tmp/index.html; echo
            docker logs animeko-ci
            exit 1
          fi

          # 再取一个真实的 JS 产物：index.html 里引用了、但服务器 404 的话，
          # 页面同样是白的（典型原因：COPY 了 dist 但只拷了 index.html）
          ASSET=$(grep -oE 'src="/[^"]+\.js"' /tmp/index.html | head -1 | sed 's/src="//; s/"$//')
          if [ -z "$ASSET" ]; then
            echo "::error::首页没有引用任何 JS 产物"
            head -c 400 /tmp/index.html; echo
            exit 1
          fi
          # 只看「HTTP 200」是假的：托管逻辑一旦把 SPA 回退套到缺失资源上，
          # 这个请求会拿到 200 + 一份 index.html，于是「JS 存在」通过，
          # 而浏览器会因为 MIME 不对拒绝执行模块 —— 用户仍是白屏。
          curl -fsS "http://127.0.0.1:18080${ASSET}" -o /tmp/app.js -D /tmp/app.h
          CT=$(grep -i '^content-type:' /tmp/app.h | tr -d '\r' | awk '{print $2}')
          case "$CT" in
            *javascript*|*ecmascript*) ;;
            *) echo "::error::JS 产物的 Content-Type 是 [$CT]，浏览器不会当模块执行"; exit 1 ;;
          esac
          if [ "$(wc -c < /tmp/app.js)" -lt 1000 ]; then
            echo "::error::JS 产物只有 $(wc -c < /tmp/app.js) 字节，不像真的 bundle"
            exit 1
          fi
          # 缺失资源必须 404 而不是回退成 index.html（同一判据在 live-smoke 里已有）
          code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080/assets/definitely-missing-42.js")
          if [ "$code" != "404" ]; then
            echo "::error::缺失的 JS 返回 $code（应为 404；回退成 HTML 会让重新部署后的旧 index 永久白屏）"
            exit 1
          fi
          echo "frontend OK: ${ASSET} ($(wc -c < /tmp/app.js) bytes, $CT)"

          # PWA 资产：public/ 下的文件必须真的进了 dist，否则"添加到主屏幕"装不上
          curl -fsS http://127.0.0.1:18080/manifest.webmanifest -o /tmp/manifest.json
          grep -q '"start_url"' /tmp/manifest.json || { echo "::error::manifest 内容不对"; cat /tmp/manifest.json; exit 1; }
          # Content-Type 必须是 manifest+json：Ktor 的扩展名映射不认识 .webmanifest，
          # 不显式设置会落到 octet-stream，部分浏览器直接忽略这份 manifest
          # 用 GET + 只取头（-D - -o /dev/null），不能用 -I：
          # -I 发的是 HEAD，而 Ktor 没装 AutoHeadResponse 插件，HEAD 打不到 GET 路由，
          # 拿回来的是一份没有 Content-Type 的 405
          CT=$(curl -sS -D - -o /dev/null http://127.0.0.1:18080/manifest.webmanifest | tr -d '\r' | grep -i '^content-type' || true)
          case "$CT" in
            *manifest+json*) echo "manifest OK ($CT)" ;;
            *) echo "::error::manifest 的 Content-Type 不对：$CT"; exit 1 ;;
          esac
          curl -fsS http://127.0.0.1:18080/sw.js -o /tmp/sw.js
          grep -q 'animeko-shell' /tmp/sw.js || { echo "::error::sw.js 内容不对"; exit 1; }
          echo "PWA assets OK"

      - name: Playwright smoke (real browser)
        # 复用上面那个还在跑的容器：镜像是同一个，不用重建。
        # 这一层验的是「浏览器里真的渲染出来了」，前面几步做不到：
        # 组件没挂载、类名写错、媒体查询失效时，静态资源全是 200。
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -r e2e/requirements.txt
          python3 -m playwright install --with-deps chromium
          python3 e2e/smoke.py http://127.0.0.1:18080

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/**/*.png
          if-no-files-found: ignore

      - name: Container logs on failure
        if: failure()
        run: docker logs animeko-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f animeko-ci || true
