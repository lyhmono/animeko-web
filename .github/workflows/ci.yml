name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend tests
        working-directory: backend
        run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend typecheck + build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # 镜像能构建 + 能启动，才算「部署没问题」。
  # 单独加这一步的理由：backend/frontend 两个 job 验的是源码，而用户真正跑的是
  # Dockerfile 产出的镜像 —— COPY 路径写错、entrypoint 权限丢了、JRE 里缺东西，
  # 前两个 job 全是绿的，只有部署那一刻才炸。
  # 除了 build 还真的把容器跑起来打一次 /api/health：
  # 这一步同时验证了 entrypoint 的 gosu 降权、/data 可写、前端产物落位。
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # load 是为了下一步能直接 docker run 这个镜像
          load: true
          tags: animeko-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (start container, hit health endpoint)
        run: |
          set -euo pipefail
          # 用匿名卷挂 /data：验证非 root 用户能写数据目录
          docker run -d --name animeko-ci \
            -p 18080:8080 \
            --tmpfs /data:rw,uid=10001,gid=10001 \
            animeko-web:ci

          # JVM 冷启动 + 首次建数据文件，给足 60 秒；失败时把日志打出来再退出
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/health >/tmp/health.json 2>/dev/null; then
              echo "health OK after ${i}s"
              cat /tmp/health.json
              exit 0
            fi
            # 容器已经退出就不用再等了，直接报错
            if [ "$(docker inspect -f '{{.State.Running}}' animeko-ci)" != "true" ]; then
              echo "::error::容器启动后退出了"
              docker logs animeko-ci
              exit 1
            fi
            sleep 1
          done

          echo "::error::60 秒内 /api/health 没有就绪"
          docker logs animeko-ci
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs animeko-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f animeko-ci || true
