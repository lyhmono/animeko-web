# Dependabot：Actions、Docker 基础镜像与根目录 npm 依赖的周更。
# 旧 frontend(Vite) 与 backend(Gradle) 已随 Next.js 迁移移除，对应配置一并清理。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # 播放器相关依赖总是一起动，拆开只是噪音
      player:
        patterns:
          - artplayer
          - artplayer-plugin-*
          - hls.js
      build-tooling:
        patterns:
          - typescript
          - '@types/*'
          - tailwindcss
          - postcss
          - autoprefixer
