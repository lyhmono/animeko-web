<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA：装到主屏后以 standalone 打开，没有浏览器地址栏 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Animeko" />
    <!-- black-translucent 让内容延伸到状态栏下方；配合 viewport-fit=cover 与
         底部安全区内边距，刘海屏/手势条都不会压住内容 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0f" />
    <title>Animeko Web · 自托管追番与播放</title>
    <meta name="description" content="单人自托管的番剧检索、追番收藏与播放服务，数据保存在自己的服务器上。" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 同步写回主题：入口模块是 deferred 的，等它执行时已经上过一帧暗色，
      // 亮色用户每次硬加载都会闪一下。键名前缀与 lib/storage.ts 的 PREFIX 一致。
      try {
        var t = localStorage.getItem('animeko-web:theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'light' ? '#f6f3ec' : '#0b0c0f')
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
