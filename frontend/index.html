<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Animeko Web · 自托管追番与播放</title>
    <meta name="description" content="单人自托管的番剧检索、追番收藏与播放服务，数据保存在自己的服务器上。" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 同步写回主题：入口模块是 deferred 的，等它执行时已经上过一帧暗色，
      // 亮色用户每次硬加载都会闪一下。键名前缀与 lib/storage.ts 的 PREFIX 一致。
      try {
        var t = localStorage.getItem('animeko-web:theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'light' ? '#f5f6fa' : '#0f1115')
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
