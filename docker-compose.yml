services:
  animeko-web:
    build: .
    image: animeko-web:latest
    container_name: animeko-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
      # 默认只监听本机回环。需要局域网/公网访问时，先配置登录凭据再放开。
      - '127.0.0.1:8080:8080'
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      # 无鉴权监听 0.0.0.0 时的显式确认；公网部署请改用账号密码并删除本项
      - ANIMEKO_ALLOW_NO_AUTH=true
      # ---- 登录鉴权（对外暴露前务必配置）----
      # - ANIMEKO_AUTH_USER=your-name
      # - ANIMEKO_AUTH_PASSWORD=your-strong-password
      # - ANIMEKO_AUTH_TOKEN=your-api-token
      # ---- HTTPS 部署 ----
      # - ANIMEKO_COOKIE_SECURE=true
      # - ANIMEKO_TRUSTED_PROXY_HOPS=1
      # ---- Bangumi 通道 ----
      # - ANIMEKO_BANGUMI_BASE_URLS=https://api.bgm.tv,https://bgmapi.anibt.net
      # ---- 弹幕服务（弹弹 play /api/v2 协议；官方接口需要 AppId/Secret）----
      # - ANIMEKO_DANMAKU_API_BASE=https://api.dandanplay.net
      # - ANIMEKO_DANMAKU_APP_ID=your-app-id
      # - ANIMEKO_DANMAKU_APP_SECRET=your-app-secret
      # ---- 内网源 / 其他 ----
      # - ANIMEKO_ALLOW_PRIVATE_TARGETS=true
      # - ANIMEKO_ALLOW_CROSS_ORIGIN=true
